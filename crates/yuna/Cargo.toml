[package]
name = "yuna"
description = "A Wayland compositor for Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The protocols' server side (`wayland_frontend`), its helpers for surfaces (`desktop`), and the
# GLES renderer on EGL (`renderer_gl`); no DRM, no input backend (ADR-0022).
smithay = { workspace = true, features = ["wayland_frontend", "desktop", "renderer_gl"] }
tracing.workspace = true
tracing-subscriber.workspace = true
yuna-layout = { path = "../yuna-layout" }

[dev-dependencies]
proptest.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true

[lints]
workspace = true

# Its unit tests run with the workspace's: an example's do not by default, and its parsing decides
# the figures it reports.
[[example]]
name = "frame_time"
test = true
