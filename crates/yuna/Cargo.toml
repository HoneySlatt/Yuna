[package]
name = "yuna"
description = "A Wayland compositor for Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The protocols' server side (`wayland_frontend`), its helpers for surfaces (`desktop`), and the
# GLES renderer on EGL (`renderer_gl`); no DRM, no input backend (ADR-0022).
smithay = { workspace = true, features = ["wayland_frontend", "desktop", "renderer_gl"] }
png.workspace = true
# The epoll the rest auditor wraps and poll (`event`), the D-Bus socket and the peers' credentials
# (`net`), the processes Yuna starts, watches, reaps and ends, and its limit of open files
# (`process`), memfds and descriptors' flags (`fs`), mappings (`mm`), pipes (`pipe`), and the
# clocks the tests read (`time`). The same crate and version Smithay uses: declared, so that Yuna
# reaches it directly rather than through Smithay's re-exports (the owner, 2026-11-18).
rustix = { workspace = true, features = ["event", "fs", "mm", "net", "pipe", "process", "time"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
x11rb.workspace = true
zbus.workspace = true
yuna-layout = { path = "../yuna-layout" }
yuna-motion = { path = "../yuna-motion" }

[dev-dependencies]
proptest.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
# The test drivers' virtual keyboard and pointer (ADR-0089).
wayland-protocols-misc.workspace = true
wayland-protocols-wlr.workspace = true
# The readers of `/proc`, the DRM statistics and the machine's load that the measuring examples
# use: the repository reads them one way.
yuna-bench = { path = "../yuna-bench" }

[lints]
workspace = true

# Its unit tests run with the workspace's: an example's do not by default, and its parsing decides
# the figures it reports.
[[example]]
name = "frame_time"
test = true

[[example]]
name = "agent_time"
test = true

[[example]]
name = "motion_time"
test = true

[[example]]
name = "xwayland_time"
test = true

[[example]]
name = "instances"
test = true
