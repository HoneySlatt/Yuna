# The timed tier: judged over pairs by an interval on ln(head / base) (`rule.rs`); `relative` is T,
# the share of the base's value a figure may grow by, `absolute` unused but for the soak's slope,
# judged against no growth: `absolute` KiB a minute, the ten instances together. Each T is twice
# the widest σ of ln(head / base) over the quiet pairs of the tree against itself, two series of
# 20 pairs on the owner's desktop shared with other sessions' work (Ryzen 7 5800X, llvmpipe of
# Mesa 26.3.0, 2026-11-20, .delegation/m2.1-timed, local): with T at 2 σ the self control passes on
# its least pairs, and a head slower by 1.5 T is shown worse on them. The GPU's groups
# (`<case>-gpu`), not measured yet, take each kind's `*`, its widest group's.

