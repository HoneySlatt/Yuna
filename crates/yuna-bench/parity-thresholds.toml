# The parity script's classes and thresholds (ADR-0142): how each figure is judged, `parity`,
# `budget` or `recorded`; how far each parity figure may grow before it is worse, `max(relative ×
# base, absolute)`; and the spread each came from. The script judges with the head's file; a
# class the head changes, or a threshold it loosens, against the base's makes its figure void,
# unless a new [[move]] in parity-baseline.toml names the figure. Format:
# crates/yuna-bench/src/parity/thresholds.rs.
#
# The spreads: the M2.1 tree against itself, five measurements a side, three times (all figures
# twice, the scenarios' once more), on the owner's desktop (Ryzen 7 5800X), 2026-11-19 and 20
# (.delegation/, local). A spread is a figure's range over its median, over a series' ten; each
# threshold takes the widest of the series. Desktop only: not yet measured on GitHub's runner.
#
# Measured again on one-unit builds (ADR-0148), 2026-11-21: the tree against itself, one series of
# five a side (docs/measurements.md). One series is too thin to set a threshold by: the CI tier's
# thresholds stay M2.1's until two more series are measured. The timed and GPU tiers' entries,
# after the CI tier's, come from that day's self controls.

format = 2

[[threshold]]
figure = "instructions a frame, yuna"
group = "*"
class = "parity"
relative = 0.006
absolute = 600
basis = "3 × 0.196 %, the widest spread but motion's, idle's; floor 3 × 183, the widest range but motion's, full's"

[[threshold]]
figure = "instructions a frame, yuna"
