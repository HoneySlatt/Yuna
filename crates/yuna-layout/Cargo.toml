[package]
name = "yuna-layout"
description = "Yuna's layout model: workspaces, outputs, seats and window placement, with no Wayland object"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
yuna-types = { path = "../yuna-types" }

[dev-dependencies]
proptest.workspace = true

[features]
# The parity script's canary (ADR-0142's controls), which the script must flag:
# work added to `Layout::focus`. Off in every shipped build; `yuna-bench parity run --canary` turns it on
# in the head it builds.
parity-canary = []

[lints]
workspace = true
