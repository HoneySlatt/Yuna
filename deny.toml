# cargo-deny's policy for Yuna's dependencies: their licences, their advisories and where they come
# from. scripts/check.sh runs `cargo deny --locked check`, which reads the advisory database from the
# network.

[graph]
# Every feature of Yuna's crates, not only the default ones.
all-features = true
# Linux only (ADR-0006): the crates of other platforms in Cargo.lock are never built.
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
# Every RustSec advisory fails the check, on any crate of the graph, direct or not: a vulnerability
# always does; an unsound or an unmaintained crate does through the two settings below (cargo-deny's
# default for unsound crates covers only Yuna's direct dependencies). A yanked crate fails too: its
# author withdrew it. One advisory may be ignored only by an entry here that says why.
unsound = "all"
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Only licences whose code may be distributed inside a GPL-3.0-or-later program (ADR-0009). A licence
# not listed is refused, so the check fails safe: one a new dependency needs is added here when it
# comes, after checking its compatibility. Never listed: GPL-2.0-only and the other licences the Free
# Software Foundation calls incompatible with the GPL version 3; GPL-3.0-only and LGPL-3.0-only,
# which would make Yuna GPL-3.0-only (ADR-0013); and the AGPL, whose network clause would bind Yuna.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# The list says what may come in, not what has come in yet.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between Yuna's own crates carry no version; that is not a wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Smithay is taken from Yuna's fork at a pinned commit (ADR-0011, ADR-0017, ADR-0044).
allow-git = ["https://github.com/HoneySlatt/smithay"]
