[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# The toolchain pinned in rust-toolchain.toml; raised with it (ADR-0016).
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Pinned to one revision of the upstream repository, raised at each stage's end (ADR-0011,
# ADR-0017). Each crate turns on the features it uses.
smithay = { git = "https://github.com/Smithay/smithay.git", rev = "8fd9fe0c74e5c13a1fc9b6797d3960c8381bda55", default-features = false }
# Property tests of the layout model (M1.2), in tests only. Without its default features: no
# forking, no timeouts, no temporary files.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
# AGENTS.md: every `unsafe` block says why it is sound, in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"
