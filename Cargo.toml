[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# The toolchain pinned in rust-toolchain.toml; raised with it (ADR-0016).
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Pinned to one revision of the upstream repository, raised at each stage's end (ADR-0011,
# ADR-0017). Each crate turns on the features it uses.
smithay = { git = "https://github.com/Smithay/smithay.git", rev = "8fd9fe0c74e5c13a1fc9b6797d3960c8381bda55", default-features = false }
# Property tests of the layout model (M1.2), in tests only. Without its default features: no
# forking, no timeouts, no temporary files.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# The compositor's logs (M1.4). Smithay logs through `tracing` already.
tracing = "0.1.44"
# Writes the logs to standard error. Only its formatter: no filter language, no ANSI colours, no
# time crate; the level comes from YUNA_LOG.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
# The MCP server's messages, JSON-RPC on standard input and output (ADR-0033): `serde_json` reads
# and writes them, `serde`'s derive reads each tool's arguments.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# A capture's image, a compressed PNG, which MCP's clients show to the model (ADR-0034). Its
# tests decode captures with it too.
png = "0.18.1"
# Test clients of the headless compositor, in tests only (ADR-0025): the client side of the
# Wayland protocol and of the protocols beyond the core one, unstable and staging ones included
# (`ext-data-control-v1`, fractional scale, xdg-activation, xdg-dialog).
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }

# Smithay adds a popup positioner's values with plain sums before Yuna sees them: with overflow
# checks, a client's absurd values would panic a debug build. Built as in release (ADR-0027).
[profile.dev.package.smithay]
overflow-checks = false

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
# AGENTS.md: every `unsafe` block says why it is sound, in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"
