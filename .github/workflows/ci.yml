# Runs scripts/check.sh, every automated check of the definition of done (AGENTS.md), in the same Nix
# development shell that agents and the owner use (ADR-0036); beside it, the parity script and
# WLCS's whole suite; and builds Yuna's Nix package, a contract the owner's other projects use
# (ADR-0058, ADR-0089). Actions are pinned to commit SHAs, their release in a comment.
name: CI

on:
  # A change of Markdown files alone runs the Docs workflow instead (docs.yml): nothing here reads
  # them but the checks of their links and lengths.
  push:
    branches: [main]
    paths: ["**", "!**.md"]
  pull_request:
    paths: ["**", "!**.md"]
  # Every Monday at 06:17 UTC, without a push, so that a project at rest still learns of new
  # advisories against its dependencies. Off the hour, when GitHub delays scheduled runs.
  schedule:
    - cron: "17 6 * * 1"

# A new push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Let an unprivileged user make namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: grep -m1 'model name' /proc/cpuinfo; nproc
      - run: >-
          nix develop .#parity --no-update-lock-file --command
          cargo run --release --locked -p yuna-bench -- parity run --base baseline --head HEAD
          --tier ci --scenario partial --keep --before HEAD^1 --work /home/runner/parity || true
      - run: python3 -I debug/dhat_diff.py /home/runner/parity partial
      - run: cat target/parity/parity-*.md | grep -E 'allocations|Parity'
